name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: bash scripts/validate-release-version.sh "$RELEASE_VERSION"

      - name: Prepare release version
        id: version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "Tag $RELEASE_VERSION already exists; retrying release from that tag."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            git checkout --detach "$RELEASE_VERSION"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Quality checks
        run: make check

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.tag_exists == 'false'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Add Syft to PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          "$SYFT_CMD" version
          printf '%s\n' "${SYFT_CMD%/*}" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
